[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fortressflag"
version = "0.1.0"
description = "FortressFlag Python server SDK — pure stdlib, local in-process flag evaluation"
requires-python = ">=3.11"
# ZERO runtime dependencies (ADR-0020): this list is empty and stays empty — the emptiness
# is the gate, and CI asserts it. A runtime dependency is a supply-chain decision the user
# owns: ask, don't add.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.0",
    "mypy==1.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fortressflag"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# flake8-builtins (A) is on deliberately: getters are bool_value/string_value/number_value
# precisely because builtin-shadowing method names were rejected (ADR-0020).
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
